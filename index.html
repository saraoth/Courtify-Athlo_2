<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Courtify - Athlo Cross-Platform Flutter Canvas Engine" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- iOS support for full-screen immersive Flutter application -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Courtify" />
    
    <title>Courtify – Athlo Flutter Platform</title>

    <style>
      /* Ensure full-screen CanvasKit experience similar to a pure Flutter web engine */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0B0F19;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Real Flutter Web structure containing the main compiled Dart engine canvas -->
    <flt-glass-pane style="position: absolute; inset: 0px; overflow: hidden; display: flex; flex-direction: column;">
      <div id="root" class="w-full h-full flex flex-col"></div>
    </flt-glass-pane>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
